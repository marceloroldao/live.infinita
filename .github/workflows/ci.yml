name: CI

on:
  push:
    branches:
      - main
      - 'mvp/**'
      - 'feature/**'
      - 'demo/**'
      - 'hardening/**'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            tests/requirements.txt
            apps/sources/requirements-tiktok.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt -r apps/sources/requirements-tiktok.txt 'websockets>=15,<18'

      - name: Compile Python
        run: python -m compileall -q apps packages tests deploy

      - name: Unit and API tests
        run: python -m unittest discover -v -s tests -p 'test_*.py'

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            echo "bash -n $script"
            bash -n "$script"
          done < <(find deploy -maxdepth 1 -type f -name '*.sh' -print0)

      - name: Validate Godot project and GDScript
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION=4.7.2
          GODOT_TAG="${GODOT_VERSION}-stable"
          ZIP="Godot_v${GODOT_TAG}_linux.x86_64.zip"
          curl -fsSL "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/${ZIP}" -o "/tmp/${ZIP}"
          unzip -q "/tmp/${ZIP}" -d /tmp/godot
          GODOT_BIN="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_v*_linux.x86_64' | head -n1)"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --headless --editor --quit --path apps/renderer-godot

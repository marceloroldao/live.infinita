name: Server Cognitive RC1

on:
  push:
    branches:
      - release/server-cognitive-rc1
    paths:
      - 'apps/server-cognitive/**'
      - 'apps/world-runtime/scenario_server_cognitive_rc1.py'
      - 'deploy/server-cognitive-rc1/**'
      - '.github/workflows/server-cognitive-rc1.yml'
  pull_request:
    branches:
      - experiment/memoria-v2-cognitive-gym
    paths:
      - 'apps/server-cognitive/**'
      - 'apps/world-runtime/scenario_server_cognitive_rc1.py'
      - 'deploy/server-cognitive-rc1/**'
      - '.github/workflows/server-cognitive-rc1.yml'

jobs:
  server-cognitive-rc1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Live.Infinita
        uses: actions/checkout@v4

      - name: Checkout pinned Memoria.ia
        uses: actions/checkout@v4
        with:
          repository: marceloroldao/memoria.ia
          ref: 45fdbe5b2404e00d40f492c2e503172a8eb22433
          path: .vendor/memoria.ia

      - name: Checkout pinned bit.analyze
        uses: actions/checkout@v4
        with:
          repository: marceloroldao/bit.analyze
          ref: 2192c61e514a7bb500500ab9fff63bd42940dc52
          path: .vendor/bit.analyze

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Compile RC1 server files
        run: >-
          python -m py_compile
          apps/server-cognitive/bootstrap_paths.py
          apps/server-cognitive/engine.py
          apps/server-cognitive/server.py
          apps/world-runtime/scenario_server_cognitive_rc1.py

      - name: Validate pinned dependency heads
        run: |
          test "$(git -C .vendor/memoria.ia rev-parse HEAD)" = "45fdbe5b2404e00d40f492c2e503172a8eb22433"
          test "$(git -C .vendor/bit.analyze rev-parse HEAD)" = "2192c61e514a7bb500500ab9fff63bd42940dc52"

      - name: Run Server Cognitive RC1 engine tests
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/server-cognitive:${{ github.workspace }}/apps/world-runtime:${{ github.workspace }}/.vendor/memoria.ia/src:${{ github.workspace }}/.vendor/bit.analyze/experiments/temporal_multimodal
        run: python -m pytest -q apps/server-cognitive/test_server_cognitive_rc1.py

      - name: Recheck Gate 028 event-time boundary
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/world-runtime:${{ github.workspace }}/.vendor/memoria.ia/src:${{ github.workspace }}/.vendor/bit.analyze/experiments/temporal_multimodal
        working-directory: apps/world-runtime
        run: python -m pytest -q test_life_gate_028_crossrepo.py

      - name: HTTP smoke
        run: |
          chmod +x deploy/server-cognitive-rc1/run.sh deploy/server-cognitive-rc1/smoke.sh
          ./deploy/server-cognitive-rc1/smoke.sh

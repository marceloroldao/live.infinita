name: memoria-v2 cognitive gym

on:
  pull_request:
    paths:
      - 'apps/world-runtime/memoria_v2_adapter.py'
      - 'apps/world-runtime/test_memoria_v2_adapter.py'
      - 'apps/world-runtime/scenario_nova_r1_r2.py'
      - 'apps/world-runtime/test_scenario_nova_r1_r2.py'
      - 'apps/world-runtime/test_memoria_v2_crossrepo.py'
      - 'apps/world-runtime/scenario_active_curiosity.py'
      - 'apps/world-runtime/test_active_curiosity_crossrepo.py'
      - 'apps/world-runtime/closed_loop_runtime.py'
      - 'apps/world-runtime/test_closed_loop_crossrepo.py'
      - 'apps/world-runtime/scenario_continuous_closed_loop.py'
      - 'apps/world-runtime/test_continuous_closed_loop_crossrepo.py'
      - 'apps/world-runtime/scenario_life_gate_001.py'
      - 'apps/world-runtime/test_life_gate_001_crossrepo.py'
      - 'apps/world-runtime/nov_need_scheduler.py'
      - 'apps/world-runtime/test_nov_need_scheduler.py'
      - 'apps/world-runtime/nov_autonomous_life.py'
      - 'apps/world-runtime/scenario_life_gate_002.py'
      - 'apps/world-runtime/test_life_gate_002_crossrepo.py'
      - 'apps/world-runtime/environmental_agent_runtime.py'
      - 'apps/world-runtime/environmental_perception.py'
      - 'apps/world-runtime/spatial_runtime.py'
      - 'apps/world-runtime/scenario_life_gate_003.py'
      - 'apps/world-runtime/test_environmental_agent_runtime.py'
      - 'apps/world-runtime/world_property_runtime.py'
      - 'apps/world-runtime/scenario_life_gate_004.py'
      - 'apps/world-runtime/test_environmental_reactive_runtime.py'
      - 'apps/world-runtime/test_life_gate_004_crossrepo.py'
      - 'apps/world-runtime/distributed_environment_runtime.py'
      - 'apps/world-runtime/scenario_life_gate_005.py'
      - 'apps/world-runtime/test_distributed_environment_runtime.py'
      - 'apps/world-runtime/test_life_gate_005_crossrepo.py'
      - 'apps/world-runtime/environmental_sensor_runtime.py'
      - 'apps/world-runtime/scenario_life_gate_006.py'
      - 'apps/world-runtime/test_environmental_sensor_runtime.py'
      - 'apps/world-runtime/test_life_gate_006_crossrepo.py'
      - 'apps/world-runtime/environmental_multisensor_runtime.py'
      - 'apps/world-runtime/scenario_life_gate_007.py'
      - 'apps/world-runtime/test_environmental_multisensor_runtime.py'
      - 'apps/world-runtime/test_life_gate_007_crossrepo.py'
      - 'apps/world-runtime/reality_slice_bridge.py'
      - 'apps/world-runtime/scenario_life_gate_008.py'
      - 'apps/world-runtime/test_life_gate_008_crossrepo.py'
      - 'apps/world-runtime/test_life_gate_003_crossrepo.py'
      - 'schemas/memoria-v2-cognitive-frame.schema.json'
      - 'examples/memoria-v2-cognitive-frame.minimal.json'
      - 'docs/MEMORIA_V2_COGNITIVE_GYM.md'
      - 'docs/LIFE_GATE_001.md'
      - 'docs/LIFE_GATE_002.md'
      - 'docs/LIFE_GATE_003.md'
      - 'docs/LIFE_GATE_004.md'
      - 'docs/LIFE_GATE_005.md'
      - 'docs/LIFE_GATE_006.md'
      - 'docs/LIFE_GATE_007.md'
      - 'docs/LIFE_GATE_008.md'
      - '.github/workflows/memoria-v2-cognitive-gym.yml'
  workflow_dispatch:

jobs:
  adapter-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Live.Infinita
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest jsonschema
      - name: Run adapter and scenario tests
        working-directory: apps/world-runtime
        run: python -m pytest -q test_memoria_v2_adapter.py test_scenario_nova_r1_r2.py test_nov_need_scheduler.py test_environmental_agent_runtime.py test_environmental_reactive_runtime.py test_distributed_environment_runtime.py test_environmental_sensor_runtime.py test_environmental_multisensor_runtime.py
      - name: Validate cognitive frame example against schema
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          schema = json.load(open('schemas/memoria-v2-cognitive-frame.schema.json', encoding='utf-8'))
          example = json.load(open('examples/memoria-v2-cognitive-frame.minimal.json', encoding='utf-8'))
          Draft202012Validator(schema).validate(example)
          print('schema fixture: OK')
          PY

  cross-repo-memoria-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Live.Infinita
        uses: actions/checkout@v4
        with:
          path: live-infinita
      - name: Checkout Memoria.ia V2 experimental branch
        uses: actions/checkout@v4
        with:
          repository: marceloroldao/memoria.ia
          ref: experiment/address-trajectory-v2
          path: memoria-ia
      - name: Checkout bit.analyze temporal RealitySlice experiment
        uses: actions/checkout@v4
        with:
          repository: marceloroldao/bit.analyze
          ref: experiment/temporal-multimodal-reality-slice
          path: bit-analyze
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run Live -> Memoria.ia V2 cross-repo gym
        env:
          PYTHONPATH: ${{ github.workspace }}/memoria-ia/src:${{ github.workspace }}/bit-analyze/experiments/temporal_multimodal:${{ github.workspace }}/live-infinita/apps/world-runtime
        working-directory: live-infinita/apps/world-runtime
        run: >-
          python -m pytest -q
          test_memoria_v2_crossrepo.py
          test_active_curiosity_crossrepo.py
          test_closed_loop_crossrepo.py
          test_continuous_closed_loop_crossrepo.py
          test_life_gate_001_crossrepo.py
          test_life_gate_002_crossrepo.py
          test_life_gate_003_crossrepo.py
          test_life_gate_004_crossrepo.py
          test_life_gate_005_crossrepo.py
          test_life_gate_006_crossrepo.py
          test_life_gate_007_crossrepo.py
          test_life_gate_008_crossrepo.py

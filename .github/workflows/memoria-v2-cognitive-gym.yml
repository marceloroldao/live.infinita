jobs:
  adapter-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Live.Infinita
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest jsonschema
      - name: Run adapter and scenario tests
        working-directory: apps/world-runtime
        run: python -m pytest -q test_memoria_v2_adapter.py test_scenario_nova_r1_r2.py test_nov_need_scheduler.py test_environmental_agent_runtime.py test_environmental_reactive_runtime.py test_distributed_environment_runtime.py test_environmental_sensor_runtime.py test_environmental_multisensor_runtime.py test_environmental_future_runtime.py test_environmental_branching_runtime.py test_environmental_influence_agent_runtime.py test_environmental_agent_signal_runtime.py test_environmental_context_runtime.py test_environmental_context_process_runtime.py test_environmental_state_interaction_runtime.py
      - name: Validate cognitive frame example against schema
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          schema = json.load(open('schemas/memoria-v2-cognitive-frame.schema.json', encoding='utf-8'))
          example = json.load(open('examples/memoria-v2-cognitive-frame.minimal.json', encoding='utf-8'))
          Draft202012Validator(schema).validate(example)
          print('schema fixture: OK')
          PY

  cross-repo-memoria-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Live.Infinita
        uses: actions/checkout@v4
        with:
          path: live-infinita
      - name: Checkout Memoria.ia V2 experimental branch
        uses: actions/checkout@v4
        with:
          repository: marceloroldao/memoria.ia
          ref: 45fdbe5b2404e00d40f492c2e503172a8eb22433
          path: memoria-ia
      - name: Checkout bit.analyze temporal RealitySlice experiment
        uses: actions/checkout@v4
        with:
          repository: marceloroldao/bit.analyze
          ref: f118ef21292fcdad3c9b615e2f8dd34fd236534f
          path: bit-analyze
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Validate pinned bit.analyze higher-order unit tests
        working-directory: bit-analyze
        run: python -m pytest -q experiments/temporal_multimodal/tests/test_temporal_multimodal.py
      - name: Validate pinned Memoria.ia structural context tests
        working-directory: memoria-ia
        run: python -m pytest -q tests/test_structural_context_observation_v2.py tests/test_structural_context_recall_v2.py tests/test_structural_context_admission_state_v2.py
      - name: Run Live -> Memoria.ia V2 cross-repo gym
        env:
          PYTHONPATH: ${{ github.workspace }}/memoria-ia/src:${{ github.workspace }}/bit-analyze/experiments/temporal_multimodal:${{ github.workspace }}/live-infinita/apps/world-runtime
        working-directory: live-infinita/apps/world-runtime
        run: >-
          python -m pytest -q
          test_memoria_v2_crossrepo.py
          test_active_curiosity_crossrepo.py
          test_closed_loop_crossrepo.py
          test_continuous_closed_loop_crossrepo.py
          test_life_gate_001_crossrepo.py
          test_life_gate_002_crossrepo.py
          test_life_gate_003_crossrepo.py
          test_life_gate_004_crossrepo.py
          test_life_gate_005_crossrepo.py
          test_life_gate_006_crossrepo.py
          test_life_gate_007_crossrepo.py
          test_life_gate_008_crossrepo.py
          test_temporal_evidence_selector_crossrepo.py
          test_life_gate_009_crossrepo.py
          test_life_gate_010_crossrepo.py
          test_life_gate_011_crossrepo.py
          test_life_gate_012_crossrepo.py
          test_life_gate_013_crossrepo.py
          test_life_gate_014_crossrepo.py
          test_life_gate_015_crossrepo.py
          test_life_gate_016_crossrepo.py
          test_life_gate_017_crossrepo.py
          test_life_gate_018_crossrepo.py
          test_life_gate_019_crossrepo.py
          test_life_gate_020_crossrepo.py
          test_life_gate_021_crossrepo.py
          test_life_gate_022_crossrepo.py

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location = /godot { return 308 /godot/; }
    location ^~ /godot/ {
        alias /var/www/live-infinita-godot/;
        try_files $uri $uri/ /godot/index.html;
        add_header Cache-Control "no-cache" always;
    }
    location /ws {
        proxy_pass http://127.0.0.1:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name live.etbra.com.br;

    ssl_certificate /etc/letsencrypt/live/live.etbra.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live.etbra.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /godot { return 308 /godot/; }
    location ^~ /godot/ {
        alias /var/www/live-infinita-godot/;
        try_files $uri $uri/ /godot/index.html;
        add_header Cache-Control "no-cache" always;
    }
    location /ws {
        proxy_pass http://127.0.0.1:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name live.etbra.com.br;
    return 301 https://$host$request_uri;
}
